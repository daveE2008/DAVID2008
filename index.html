
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamPort - CBT Portal</title>

    <style>
        body {
            background-color: #ddffdd;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            color: blue;
            background-color: rgb(235, 6, 6);
            padding: 10px;
        }

        input {
            padding: 8px;
            margin-top: 5px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>EXAMPORT</h1>
    <p>Computer-Based Testing Portal</p>

    <h2>Welcome, Candidate!</h2>

    <p>
        Your journey to success starts here.
        Confirm your details to access your examination.
    </p>

    <form id="candidateForm">
        <label for="name">Student Name:</label><br>
        <input type="text" id="name"
               placeholder="Enter your full name" autocomplete="name" required>
        <br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password"
               placeholder="Enter password" inputmode="numeric"
               autocomplete="current-password" required>
        <br><br>

        <p id="formMessage" role="alert" aria-live="polite"></p>
        <button type="submit">Proceed to Examination</button>
    </form>

    <p>Please ensure your details are correct before proceeding.</p>
    <p><a href="log.html">Sign in as a different candidate</a></p>

    <script>
        const nameInput = document.getElementById("name");
        const passwordInput = document.getElementById("password");
        const formMessage = document.getElementById("formMessage");

        // Carry the validated sign-in details into the portal form.
        nameInput.value = localStorage.getItem("studentName") || "";
        passwordInput.value = localStorage.getItem("examPassword") || "";

        // Recheck the sign-in rules here in case a candidate edits the details.
        document.getElementById("candidateForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                const name = nameInput.value.trim();
                const password = passwordInput.value.trim();
                const passwordValue = Number(password);

                if (!/^[a-e]/i.test(name)) {
                    formMessage.textContent =
                        "Name not found or password incorrect.";
                    nameInput.focus();
                    return;
                }

                if (!/^\d+$/.test(password) ||
                    !Number.isInteger(passwordValue) ||
                    passwordValue < 1 ||
                    passwordValue > 1000) {
                    formMessage.textContent =
                        "Name not found or password incorrect.";
                    passwordInput.focus();
                    return;
                }

                formMessage.textContent = "";
                localStorage.setItem("studentName", name);
                localStorage.setItem("examPassword", password);
                localStorage.removeItem("examNumber");
                localStorage.removeItem("examResult");
                window.location.href = "examination.html";
            });
    </script>

</body>
</html>
