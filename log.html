<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamPort - Candidate Sign In</title>

    <style>
        body {
            background-color: #ddffdd;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            color: blue;
            background-color: rgb(235, 6, 6);
            padding: 10px;
        }

        input {
            padding: 8px;
            margin-top: 5px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>EXAMPORT</h1>
    <h2>Candidate Sign In</h2>

    <p>Enter your name and password to continue to the portal.</p>
    <p>Names must start with A to E. Passwords must be whole numbers from 1 to 1000.</p>
    
    <form id="loginForm" novalidate>
        <label for="studentName">Student Name:</label><br>
        <input type="text" id="studentName" autocomplete="name" required>
        <br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" inputmode="numeric"
               autocomplete="current-password" required>
        <br><br>

        <p id="formMessage" role="alert" aria-live="polite"></p>
        <button type="submit">Sign In</button>
    </form>

    <script>
        const loginForm = document.getElementById("loginForm");
        const studentNameInput = document.getElementById("studentName");
        const passwordInput = document.getElementById("password");
        const formMessage = document.getElementById("formMessage");

        loginForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const studentName = studentNameInput.value.trim();
            const password = passwordInput.value.trim();
            const passwordValue = Number(password);

            if (!/^[a-e]/i.test(studentName)) {
                formMessage.textContent =
                    "Name not found or password incorrect.";
                studentNameInput.focus();
                return;
            }

            if (!/^\d+$/.test(password) ||
                !Number.isInteger(passwordValue) ||
                passwordValue < 1 ||
                passwordValue > 1000) {
                formMessage.textContent =
                    "Name not found or password incorrect.";
                passwordInput.focus();
                return;
            }

            formMessage.textContent = "";
            localStorage.setItem("studentName", studentName);
            localStorage.setItem("examPassword", password);
            localStorage.removeItem("examNumber");
            localStorage.removeItem("examResult");
            window.location.href = "index.html";
        });
    </script>
</body>
</html>
